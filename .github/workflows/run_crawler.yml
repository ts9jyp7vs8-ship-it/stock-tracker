name: Daily Stock Crawler

on:
  schedule:
    - cron: '30 10 * * 1-5' # 國際標準時(UTC) 10:30 = 台北時間週一至週五 17:00
  workflow_dispatch: # 允許手動點擊按鈕執行

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: 簽出程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝套件
      run: pip install requests

    - name: 執行爬蟲
      run: python crawler.py

    - name: 將更新後的資料推回 GitHub
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add data.json
        git commit -m "自動更新每日券商籌碼資料: $(date +'%Y-%m-%d')" || exit 0
        git push
