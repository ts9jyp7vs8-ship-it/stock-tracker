<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJOR INVESTORS TRACKER</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #fcfcfc; }
        .tab-active { color: #000000; font-weight: 900; border-top: 2px solid #000000; }
        .tab-inactive { color: #a1a1aa; border-top: 2px solid transparent; }
    </style>
</head>
<body class="text-black font-sans min-h-screen pb-24">

    <!-- 頂部黑白極簡狀態欄 -->
    <header class="border-b border-black p-6 sticky top-0 bg-white z-40">
        <div class="max-w-md mx-auto flex justify-between items-baseline">
            <h1 class="text-2xl font-black tracking-tighter uppercase">Broker Tracker</h1>
            <span id="update-time" class="text-xs font-mono tracking-widest text-zinc-400">LOADING...</span>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-md mx-auto p-6">
        
        <!-- ==================== 分頁一：今日數據 ==================== -->
        <div id="tab-today-content" class="space-y-8">
            
            <!-- 連續買超區塊 -->
            <section class="border-b border-zinc-200 pb-6">
                <h2 class="text-xs font-black tracking-widest text-zinc-400 uppercase mb-4">CONSECUTIVE BUY</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="text-xs font-mono tracking-wider text-zinc-500">STREAK ≥ 3 DAYS</div>
                        <ul id="streak-3-list" class="mt-2 text-base font-black space-y-1">--</ul>
                    </div>
                    <div>
                        <div class="text-xs font-mono tracking-wider text-zinc-500">STREAK ≥ 5 DAYS</div>
                        <ul id="streak-5-list" class="mt-2 text-base font-black space-y-1">--</ul>
                    </div>
                </div>
            </section>

            <!-- 券商選擇按鈕（大字體、黑白對比） -->
            <section>
                <h2 class="text-xs font-black tracking-widest text-zinc-400 uppercase mb-3">SELECT BROKER</h2>
                <div id="broker-buttons" class="grid grid-cols-2 gap-2 text-left">
                    <!-- JS 動態生成 -->
                </div>
            </section>

            <!-- 當日數據明細 -->
            <section class="space-y-6 pt-2">
                <h3 id="current-broker-title" class="text-xl font-black tracking-tight border-b-2 border-black pb-2">元大 — TODAY</h3>
                
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <h4 class="text-xs font-black tracking-widest bg-black text-white px-2 py-1 inline-block uppercase">TOP BUY 5</h4>
                        <ul id="buy-list" class="divide-y divide-zinc-200 mt-2"></ul>
                    </div>
                    <div>
                        <h4 class="text-xs font-black tracking-widest bg-zinc-400 text-white px-2 py-1 inline-block uppercase">TOP SELL 5</h4>
                        <ul id="sell-list" class="divide-y divide-zinc-200 mt-2"></ul>
                    </div>
                </div>
            </section>
        </div>

        <!-- ==================== 分頁二：歷史紀錄 ==================== -->
        <div id="tab-history-content" class="space-y-8 hidden">
            
            <!-- 歷史日期選擇 -->
            <section>
                <h2 class="text-xs font-black tracking-widest text-zinc-400 uppercase mb-2">SELECT DATE</h2>
                <select id="history-date-select" class="w-full bg-white border-2 border-black rounded-none px-4 py-3 text-base font-black focus:outline-none appearance-none font-mono">
                    <!-- JS 動態生成 -->
                </select>
            </section>

            <!-- 歷史券商按鈕 -->
            <section id="history-broker-buttons" class="grid grid-cols-2 gap-2">
                <!-- JS 動態生成 -->
            </section>

            <!-- 歷史數據明細 -->
            <section class="space-y-6">
                <div class="border-b-2 border-black pb-2 flex justify-between items-baseline">
                    <h3 id="history-broker-title" class="text-xl font-black tracking-tight">元大 — ARCHIVE</h3>
                    <span id="history-badge-date" class="text-xs font-mono tracking-wider text-zinc-400">--</span>
                </div>
                
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <h4 class="text-xs font-black tracking-widest bg-black text-white px-2 py-1 inline-block uppercase">BUY RECORD</h4>
                        <ul id="history-buy-list" class="divide-y divide-zinc-200 mt-2"></ul>
                    </div>
                    <div>
                        <h4 class="text-xs font-black tracking-widest bg-zinc-400 text-white px-2 py-1 inline-block uppercase">SELL RECORD</h4>
                        <ul id="history-sell-list" class="divide-y divide-zinc-200 mt-2"></ul>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- ==================== 底部極簡導航欄（無 Emoji） ==================== -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-zinc-200 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <button id="tab-today-btn" class="flex flex-col items-center justify-center w-1/2 h-full text-xs font-black tracking-widest uppercase transition-all tab-active">
                TODAY
            </button>
            <button id="tab-history-btn" class="flex flex-col items-center justify-center w-1/2 h-full text-xs font-black tracking-widest uppercase transition-all tab-inactive">
                HISTORY
            </button>
        </div>
    </nav>

    <script>
        let stockData = null;
        const brokers = ["元大", "美商高盛", "台灣摩根史丹利", "摩根大通", "凱基"];
        let activeBroker = "元大";
        let historyActiveBroker = "元大";
        let historyActiveIndex = 0;

        async function init() {
            const cached = localStorage.getItem('my_stock_data');
            if (cached) {
                stockData = JSON.parse(cached);
                renderUI();
            }
            try {
                const response = await fetch('./data.json?t=' + new Date().getTime());
                stockData = await response.json();
                localStorage.setItem('my_stock_data', JSON.stringify(stockData));
                renderUI();
            } catch (e) {
                console.log("Error loading online data", e);
            }
        }

        document.getElementById('tab-today-btn').onclick = () => switchTab('today');
        document.getElementById('tab-history-btn').onclick = () => switchTab('history');

        function switchTab(tab) {
            const todayBtn = document.getElementById('tab-today-btn');
            const historyBtn = document.getElementById('tab-history-btn');
            const todayContent = document.getElementById('tab-today-content');
            const historyContent = document.getElementById('tab-history-content');

            if (tab === 'today') {
                todayBtn.className = "flex flex-col items-center justify-center w-1/2 h-full text-xs font-black tracking-widest uppercase tab-active";
                historyBtn.className = "flex flex-col items-center justify-center w-1/2 h-full text-xs font-black tracking-widest uppercase tab-inactive";
                todayContent.classList.remove('hidden');
                historyContent.classList.add('hidden');
            } else {
                todayBtn.className = "flex flex-col items-center justify-center w-1/2 h-full text-xs font-black tracking-widest uppercase tab-inactive";
                historyBtn.className = "flex flex-col items-center justify-center w-1/2 h-full text-xs font-black tracking-widest uppercase tab-active";
                todayContent.classList.add('hidden');
                historyContent.classList.remove('hidden');
                renderHistoryUI();
            }
        }

        function renderUI() {
            if (!stockData) return;
            
            document.getElementById('update-time').innerText = `${stockData.last_update || 'NO DATE'}`;
            
            renderList('streak-3-list', stockData.streak_3);
            renderList('streak-5-list', stockData.streak_5);

            renderBrokerButtons('broker-buttons', activeBroker, (name) => {
                activeBroker = name;
                renderUI();
            });

            document.getElementById('current-broker-title').innerText = `${activeBroker} — TODAY`;
            const latestDayData = stockData.daily_records?.?.data?.[activeBroker] || { buys: [], sells: [] };
            renderStockItems('buy-list', latestDayData.buys);
            renderStockItems('sell-list', latestDayData.sells);

            const select = document.getElementById('history-date-select');
            if (stockData.daily_records && select.options.length === 0) {
                select.innerHTML = stockData.daily_records.map((record, index) => 
                    `<option value="${index}">${record.date}</option>`
                ).join('');
                select.onchange = (e) => {
                    historyActiveIndex = parseInt(e.target.value);
                    renderHistoryUI();
                };
            }
        }

        function renderHistoryUI() {
            if (!stockData || !stockData.daily_records || stockData.daily_records.length === 0) return;

            const selectedRecord = stockData.daily_records[historyActiveIndex];
            document.getElementById('history-badge-date').innerText = selectedRecord.date;
            document.getElementById('history-broker-title').innerText = `${historyActiveBroker} — ARCHIVE`;

            renderBrokerButtons('history-broker-buttons', historyActiveBroker, (name) => {
