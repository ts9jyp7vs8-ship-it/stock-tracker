<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自用券商大戶追蹤器</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        /* 針對手機大按鈕與舒適點擊優化 */
        button { min-height: 48px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

    <!-- 頂部導航 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center">📊 券商籌碼每日觀測站</h1>
        <p id="update-time" class="text-xs text-center text-blue-200 mt-1">更新時間：載入中...</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- 特別功能卡片：連續買超追蹤 -->
        <section class="bg-white p-4 rounded-xl shadow">
            <h2 class="text-lg font-bold text-red-600 border-b pb-2 mb-3">🔥 連續買超追蹤 (中斷即重算)</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-red-50 p-3 rounded-lg">
                    <div class="text-sm font-semibold text-red-700">📈 連續買超 ≥ 3日</div>
                    <ul id="streak-3-list" class="mt-2 text-sm font-medium space-y-1 text-gray-700">--</ul>
                </div>
                <div class="bg-purple-50 p-3 rounded-lg">
                    <div class="text-sm font-semibold text-purple-700">👑 連續買超 ≥ 5日</div>
                    <ul id="streak-5-list" class="mt-2 text-sm font-medium space-y-1 text-gray-700">--</ul>
                </div>
            </div>
        </section>

        <!-- 券商切換大按鈕 (方便手機單手點擊) -->
        <section>
            <label class="block text-sm font-bold text-gray-500 mb-2">切換觀測券商：</label>
            <div id="broker-buttons" class="grid grid-cols-2 gap-2">
                <!-- 由 JS 動態生成大按鈕 -->
            </div>
        </section>

        <!-- 當日前五大數據看板 -->
        <section class="bg-white p-4 rounded-xl shadow">
            <h2 id="current-broker-title" class="text-lg font-bold text-gray-800 border-b pb-2 mb-3">元大 - 當日前五大</h2>
            
            <div class="space-y-4">
                <div>
                    <h3 class="text-sm font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">🟢 前五大買超股票</h3>
                    <ul id="buy-list" class="divide-y divide-gray-100 mt-1"></ul>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-rose-600 bg-rose-50 px-2 py-1 rounded">🔴 前五大賣超股票</h3>
                    <ul id="sell-list" class="divide-y divide-gray-100 mt-1"></ul>
                </div>
            </div>
        </section>

    </main>

    <script>
        let stockData = null;
        const brokers = ["元大", "美商高盛", "台灣摩根史丹利", "摩根大通", "凱基"];
        let activeBroker = "元大";

        // 初始化：先讀本地快取，再連網抓最新 GitHub 資料
        async function init() {
            const cached = localStorage.getItem('my_stock_data');
            if (cached) {
                stockData = JSON.parse(cached);
                renderUI();
            }
            
            try {
                // 讀取同專案目錄下的 data.json
                const response = await fetch('./data.json?t=' + new Date().getTime());
                stockData = await response.json();
                localStorage.setItem('my_stock_data', JSON.stringify(stockData)); // 覆蓋快取，關掉重開還在
                renderUI();
            } catch (e) {
                console.log("尚無最新網路資料，使用快取或等待 Actions 產出", e);
            }
        }

        function renderUI() {
            if (!stockData) return;
            
            document.getElementById('update-time').innerText = `更新時間：${stockData.last_update || '無資料'}`;
            
            // 渲染連續天數
            renderList('streak-3-list', stockData.streak_3, 'text-red-600');
            renderList('streak-5-list', stockData.streak_5, 'text-purple-600');

            // 渲染券商按鈕
            const btnContainer = document.getElementById('broker-buttons');
            btnContainer.innerHTML = '';
            brokers.forEach(name => {
                const btn = document.createElement('button');
                btn.className = `w-full rounded-lg text-base font-bold transition shadow-sm ${activeBroker === name ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 border border-gray-300'}`;
                btn.innerText = name;
                btn.onclick = () => { activeBroker = name; renderUI(); };
                btnContainer.appendChild(btn);
            });

            // 渲染當前券商的買賣超
            document.getElementById('current-broker-title').innerText = `${activeBroker} — 當日前五大`;
            const latestDayData = stockData.daily_records?.[0]?.data?.[activeBroker] || { buys: [], sells: [] };
            
            renderStockItems('buy-list', latestDayData.buys, 'text-emerald-600');
            renderStockItems('sell-list', latestDayData.sells, 'text-rose-600');
        }

        function renderList(elementId, array, textColor) {
            const el = document.getElementById(elementId);
            if (!array || array.length === 0) { el.innerHTML = '<li>（暫無）</li>'; return; }
            el.innerHTML = array.map(item => `<li class="${textColor}">• ${item}</li>`).join('');
        }

        function renderStockItems(elementId, items, colorClass) {
            const el = document.getElementById(elementId);
            if (!items || items.length === 0) { el.innerHTML = '<li class="py-2 text-sm text-gray-400 text-center">暫無交易數據</li>'; return; }
            el.innerHTML = items.map((item, idx) => `
                <li class="flex justify-between py-3 text-base border-b border-gray-50">
                    <span class="font-medium text-gray-900">${idx+1}. ${item.name} (${item.id})</span>
                    <span class="${colorClass} font-bold">${item.count.toLocaleString()} 張</span>
                </li>
            `).join('');
        }

        init();
    </script>
</body>
</html>
